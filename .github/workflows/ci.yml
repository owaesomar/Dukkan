name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dukkan_test
          POSTGRES_USER: dukkan
          POSTGRES_PASSWORD: dukkan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dukkan -d dukkan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd backend && uv sync --locked --all-groups
      - run: cd backend && uv run ruff check . && uv run ruff format --check .
      - run: cd backend && uv run mypy app
      - run: cd backend && DATABASE_URL=postgresql+psycopg://dukkan:dukkan@localhost:5432/dukkan_test uv run alembic upgrade head
      - run: cd backend && DATABASE_URL=postgresql+psycopg://dukkan:dukkan@localhost:5432/dukkan_test uv run alembic check
      - run: cd backend && DATABASE_URL=postgresql+psycopg://dukkan:dukkan@localhost:5432/dukkan_test TEST_DATABASE_URL=postgresql+psycopg://dukkan:dukkan@localhost:5432/dukkan_test uv run pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint && npm test && npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Python dependencies
        run: |
          cd backend
          uv export --locked --all-groups --format requirements-txt --no-hashes --output-file /tmp/dukkan-requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/dukkan-requirements.txt
      - name: Audit Node dependencies
        run: cd frontend && npm ci --no-audit --no-fund && npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --pull --tag dukkan-api:ci --file backend/Dockerfile backend
