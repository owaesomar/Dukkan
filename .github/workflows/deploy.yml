name: Deploy production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment hooks
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$BACKEND_DEPLOY_HOOK_URL" || { echo "Missing BACKEND_DEPLOY_HOOK_URL in the production environment" >&2; exit 1; }
          test -n "$FRONTEND_DEPLOY_HOOK_URL" || { echo "Missing FRONTEND_DEPLOY_HOOK_URL in the production environment" >&2; exit 1; }
      - name: Trigger backend and frontend deployment hooks
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error "$BACKEND_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error "$FRONTEND_DEPLOY_HOOK_URL"
